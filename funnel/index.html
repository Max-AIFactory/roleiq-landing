<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RoleIQ – Sales Funnel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--white:#f5f0e8;--muted:rgba(245,240,232,.45);
  --grad:linear-gradient(135deg,#2563EB,#0EA5E9);
  --c0:#60A5FA; /* mails sent */
  --c1:#F59E0B; /* cold calls */
  --c2:#34D399; /* meetings */
  --c3:#A78BFA; /* follow-up sent */
  --c4:#22D3EE; /* follow-up meetings */
  --c5:#F97316; /* LOIs */
  --c6:#6B7280; /* DNC */
}
html,body{height:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding-top:48px}

/* SUBNAV */
.subnav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:.6rem 1.5rem;
  background:rgba(0,0,0,.75);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.subnav-home{font-weight:800;font-size:1rem;color:var(--white);text-decoration:none;letter-spacing:-.3px}
.subnav-home span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subnav-links{display:flex;gap:.2rem}
.subnav-links a{
  color:rgba(255,255,255,.45);text-decoration:none;font-size:.75rem;font-weight:500;
  padding:.3rem .65rem;border-radius:5px;transition:all .2s;
}
.subnav-links a:hover{color:#fff;background:rgba(255,255,255,.07)}
.subnav-links a.active{color:#93C5FD;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3)}

/* TOOLBAR */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.7rem 1.2rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
  background:rgba(255,255,255,.02);
}
.toolbar-left{display:flex;align-items:center;gap:1rem}
.toolbar-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;color:var(--white)}
.total-badge{
  font-size:11px;font-weight:500;padding:.2rem .65rem;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:99px;color:var(--muted);
}
.toolbar-right{display:flex;gap:.6rem}
.btn{
  display:flex;align-items:center;gap:.4rem;
  padding:.4rem .9rem;border-radius:7px;font-size:12px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;border:none;
}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--white)}

/* BOARD */
.board{
  display:flex;gap:0;flex:1;overflow-x:auto;overflow-y:hidden;
  padding:.75rem .75rem .75rem;
  align-items:flex-start;
}
.board::-webkit-scrollbar{height:4px}
.board::-webkit-scrollbar-track{background:transparent}
.board::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* COLUMNS */
.col{
  display:flex;flex-direction:column;
  min-width:200px;width:200px;flex-shrink:0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.025);
  overflow:hidden;max-height:100%;
}
.col-head{
  padding:.7rem .85rem .65rem;
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.col-name-wrap{display:flex;align-items:center;gap:.5rem}
.col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.col-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.col-count{
  font-size:11px;font-weight:500;padding:.15rem .55rem;
  border-radius:99px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.35);
  min-width:24px;text-align:center;
}
.col-body{
  flex:1;overflow-y:auto;padding:.5rem .5rem;
  display:flex;flex-direction:column;gap:.4rem;
}
.col-body::-webkit-scrollbar{width:2px}
.col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}

/* CARDS */
.card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:9px;padding:.75rem .8rem;
  cursor:grab;user-select:none;transition:border-color .15s,background .15s;
  position:relative;
}
.card:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.card.dragging{opacity:.45;cursor:grabbing}
.card-name{font-size:12.5px;font-weight:600;color:var(--white);margin-bottom:.25rem;line-height:1.3;word-break:break-word}
.card-company{font-size:11px;color:var(--muted);font-weight:300}
.card-meta{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.card-tag{font-size:9.5px;padding:.15rem .5rem;border-radius:4px;font-weight:500;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.45)}
.card-date{font-size:10px;color:rgba(255,255,255,.2);margin-top:.35rem}
.card-actions{
  position:absolute;top:.5rem;right:.5rem;
  display:none;gap:.3rem;
}
.card:hover .card-actions{display:flex}
.card-btn{
  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:10px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);
  transition:all .15s;font-family:inherit;
}
.card-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.card-btn.del:hover{background:rgba(248,113,113,.2);color:#F87171}

/* DRAG OVER */
.col-body.drag-over{
  background:rgba(255,255,255,.05);
  outline:1px dashed rgba(255,255,255,.15);
  outline-offset:-4px;
}

/* ADD CARD BTN */
.add-card-btn{
  display:flex;align-items:center;gap:.4rem;
  width:100%;padding:.5rem .85rem;
  background:none;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:400;
  color:rgba(255,255,255,.2);text-align:left;
  border-top:1px solid rgba(255,255,255,.04);
  flex-shrink:0;transition:all .2s;
}
.add-card-btn:hover{color:rgba(255,255,255,.55);background:rgba(255,255,255,.03)}

/* MODAL */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
}
.modal-bg.open{display:flex}
.modal{
  background:#16213e;border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:2rem;width:360px;max-width:90vw;
}
.modal h3{font-size:15px;font-weight:600;color:var(--white);margin-bottom:1.2rem}
.modal label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.06em}
.modal input,.modal select,.modal textarea{
  width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:.55rem .75rem;color:var(--white);
  font-family:'DM Sans',sans-serif;font-size:13px;margin-bottom:1rem;
  outline:none;transition:border-color .2s;
}
.modal input::placeholder,.modal textarea::placeholder{color:rgba(255,255,255,.2)}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:rgba(37,99,235,.5)}
.modal select option{background:#16213e}
.modal textarea{resize:vertical;min-height:60px}
.modal-row{display:flex;gap:.7rem;justify-content:flex-end}
.modal-row .btn{font-size:12.5px}

/* EMPTY STATE */
.empty{
  display:flex;flex-direction:column;align-items:center;
  padding:1.5rem .5rem;opacity:.3;text-align:center;
}
.empty span{font-size:1.5rem;margin-bottom:.4rem}
.empty p{font-size:10.5px;line-height:1.4;color:var(--muted)}

/* CONTEXT MENU */
.ctx-menu{
  position:fixed;z-index:600;background:#1e2d45;
  border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:.4rem;box-shadow:0 8px 32px rgba(0,0,0,.5);
  min-width:180px;
}
.ctx-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.5rem .75rem;border-radius:6px;font-size:12px;
  cursor:pointer;color:rgba(255,255,255,.7);
  transition:background .15s;white-space:nowrap;
}
.ctx-item:hover{background:rgba(255,255,255,.08);color:#fff}
.ctx-item.danger:hover{background:rgba(248,113,113,.1);color:#F87171}
.ctx-sep{height:1px;background:rgba(255,255,255,.07);margin:.25rem 0}

/* SEARCH */
.search-wrap{position:relative;flex:1;max-width:200px}
.search-wrap input{
  width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:7px;padding:.38rem .7rem .38rem 1.9rem;color:var(--white);
  font-family:'DM Sans',sans-serif;font-size:12px;outline:none;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.2)}
.search-icon{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);font-size:11px;color:rgba(255,255,255,.25)}
</style>
</head>
<body>

<nav class="subnav">
  <a href="/" class="subnav-home">Role<span>IQ</span></a>
  <div class="subnav-links">
    <a href="/pull">PULL Framework</a>
    <a href="/pitch">Pitch</a>
    <a href="/ideation">Ideation</a>
    <a href="/funnel" class="active">Funnel</a>
  </div>
</nav>

<div class="toolbar">
  <div class="toolbar-left">
    <span class="toolbar-title">Sales Funnel</span>
    <span class="total-badge" id="totalBadge">0 Kontakte</span>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Suchen..." oninput="filterCards()"/>
    </div>
  </div>
  <div class="toolbar-right">
    <button class="btn btn-ghost" onclick="exportData()">⬇ Export</button>
    <button class="btn btn-primary" onclick="openModal()">+ Kontakt</button>
  </div>
</div>

<div class="board" id="board"></div>

<!-- ADD / EDIT MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Kontakt hinzufügen</h3>
    <label>Name *</label>
    <input type="text" id="f-name" placeholder="z.B. Maria Müller" required/>
    <label>Unternehmen</label>
    <input type="text" id="f-company" placeholder="z.B. Siemens AG"/>
    <label>Rolle</label>
    <input type="text" id="f-role" placeholder="z.B. Head of HR"/>
    <label>Stage</label>
    <select id="f-stage"></select>
    <label>Notiz</label>
    <textarea id="f-note" placeholder="z.B. Termin am 12.06., sehr interessiert..."></textarea>
    <div class="modal-row">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveCard()">Speichern</button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu" style="display:none"></div>

<script>
const STAGES=[
  {id:'mails',    label:'Mails Sent',           color:'var(--c0)',emoji:'📧'},
  {id:'calls',    label:'Cold Calls',            color:'var(--c1)',emoji:'📞'},
  {id:'meetings', label:'Meetings',              color:'var(--c2)',emoji:'🤝'},
  {id:'fup-sent', label:'Follow-up Sent',        color:'var(--c3)',emoji:'📩'},
  {id:'fup-meet', label:'Follow-up Meetings',    color:'var(--c4)',emoji:'🔄'},
  {id:'loi',      label:'LOIs',                  color:'var(--c5)',emoji:'📜'},
  {id:'dnc',      label:'Do Not Contact',        color:'var(--c6)',emoji:'🚫'},
];

let contacts=JSON.parse(localStorage.getItem('riq-funnel')||'[]');
let editId=null;
let dragId=null;
let searchQ='';

function save(){localStorage.setItem('riq-funnel',JSON.stringify(contacts))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmt(d){return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}
function stageIdx(id){return STAGES.findIndex(s=>s.id===id)}

// ── BUILD BOARD ──
function buildBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  STAGES.forEach(st=>{
    const col=document.createElement('div');
    col.className='col';
    col.dataset.stage=st.id;
    col.innerHTML=`
      <div class="col-head">
        <div class="col-name-wrap">
          <div class="col-dot" style="background:${st.color}"></div>
          <span class="col-name" style="color:${st.color}">${st.emoji} ${st.label}</span>
        </div>
        <span class="col-count" id="cnt-${st.id}">0</span>
      </div>
      <div class="col-body" id="body-${st.id}"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event,'${st.id}')">
      </div>
      <button class="add-card-btn" onclick="openModal('${st.id}')">+ Kontakt</button>
    `;
    board.appendChild(col);
  });
  renderCards();
}

function renderCards(){
  STAGES.forEach(st=>{
    const body=document.getElementById('body-'+st.id);
    body.innerHTML='';
    const filtered=contacts.filter(c=>c.stage===st.id&&matchSearch(c));
    if(filtered.length===0){
      body.innerHTML=`<div class="empty"><span>${st.emoji}</span><p>Noch keine Kontakte</p></div>`;
    }else{
      filtered.forEach(c=>{
        body.appendChild(makeCard(c,st));
      });
    }
    document.getElementById('cnt-'+st.id).textContent=
      contacts.filter(c=>c.stage===st.id).length;
  });
  const total=contacts.length;
  document.getElementById('totalBadge').textContent=total+' Kontakt'+(total!==1?'e':'');
}

function matchSearch(c){
  if(!searchQ)return true;
  const q=searchQ.toLowerCase();
  return (c.name||'').toLowerCase().includes(q)||
         (c.company||'').toLowerCase().includes(q)||
         (c.role||'').toLowerCase().includes(q);
}

function makeCard(c,st){
  const div=document.createElement('div');
  div.className='card';
  div.draggable=true;
  div.dataset.id=c.id;
  div.innerHTML=`
    <div class="card-actions">
      <button class="card-btn" title="Bearbeiten" onclick="editCard('${c.id}')">✏️</button>
      <button class="card-btn del" title="Löschen" onclick="deleteCard('${c.id}')">🗑</button>
    </div>
    <div class="card-name">${esc(c.name)}</div>
    ${c.company?`<div class="card-company">${esc(c.company)}</div>`:''}
    <div class="card-meta">
      ${c.role?`<span class="card-tag">${esc(c.role)}</span>`:''}
    </div>
    ${c.note?`<div class="card-date">${esc(c.note.substring(0,60))}${c.note.length>60?'…':''}</div>`:''}
    <div class="card-date">${fmt(c.created)}</div>
  `;
  div.addEventListener('dragstart',e=>{dragStart(e,c.id)});
  div.addEventListener('dragend',dragEnd);
  div.addEventListener('contextmenu',e=>{showCtx(e,c)});
  return div;
}

function esc(s){
  if(!s)return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── MODAL ──
function populateStageSelect(sel){
  const s=document.getElementById('f-stage');
  s.innerHTML='';
  STAGES.forEach(st=>{
    const opt=document.createElement('option');
    opt.value=st.id;
    opt.textContent=st.emoji+' '+st.label;
    if(st.id===sel)opt.selected=true;
    s.appendChild(opt);
  });
}

function openModal(stageId,id){
  editId=id||null;
  document.getElementById('modalTitle').textContent=id?'Kontakt bearbeiten':'Kontakt hinzufügen';
  if(id){
    const c=contacts.find(x=>x.id===id);
    document.getElementById('f-name').value=c.name||'';
    document.getElementById('f-company').value=c.company||'';
    document.getElementById('f-role').value=c.role||'';
    document.getElementById('f-note').value=c.note||'';
    populateStageSelect(c.stage);
  }else{
    document.getElementById('f-name').value='';
    document.getElementById('f-company').value='';
    document.getElementById('f-role').value='';
    document.getElementById('f-note').value='';
    populateStageSelect(stageId||STAGES[0].id);
  }
  document.getElementById('modalBg').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),100);
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  editId=null;
}

function saveCard(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').style.borderColor='#F87171';return}
  document.getElementById('f-name').style.borderColor='';
  const stage=document.getElementById('f-stage').value;
  const company=document.getElementById('f-company').value.trim();
  const role=document.getElementById('f-role').value.trim();
  const note=document.getElementById('f-note').value.trim();
  if(editId){
    const idx=contacts.findIndex(c=>c.id===editId);
    if(idx>-1){Object.assign(contacts[idx],{name,company,role,stage,note,updated:Date.now()})}
  }else{
    contacts.push({id:uid(),name,company,role,stage,note,created:Date.now()});
  }
  save();
  renderCards();
  closeModal();
}

function deleteCard(id){
  if(!confirm('Kontakt löschen?'))return;
  contacts=contacts.filter(c=>c.id!==id);
  save();renderCards();
}

function editCard(id){openModal(null,id)}

// ── DRAG & DROP ──
function dragStart(e,id){
  dragId=id;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{
    const el=document.querySelector(`.card[data-id="${id}"]`);
    if(el)el.classList.add('dragging');
  },0);
}
function dragEnd(){
  dragId=null;
  document.querySelectorAll('.card.dragging').forEach(el=>el.classList.remove('dragging'));
}
function onDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function onDrop(e,stageId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!dragId)return;
  const c=contacts.find(x=>x.id===dragId);
  if(c)c.stage=stageId;
  save();renderCards();
}

// ── CONTEXT MENU ──
function showCtx(e,c){
  e.preventDefault();
  hideCtx();
  const menu=document.getElementById('ctxMenu');
  const si=stageIdx(c.stage);
  let html='';
  if(si>0)html+=`<div class="ctx-item" onclick="moveCard('${c.id}','${STAGES[si-1].id}')">← ${STAGES[si-1].emoji} ${STAGES[si-1].label}</div>`;
  if(si<STAGES.length-1)html+=`<div class="ctx-item" onclick="moveCard('${c.id}','${STAGES[si+1].id}')">→ ${STAGES[si+1].emoji} ${STAGES[si+1].label}</div>`;
  html+=`<div class="ctx-sep"></div>`;
  html+=`<div class="ctx-item" onclick="editCard('${c.id}');hideCtx()">✏️ Bearbeiten</div>`;
  html+=`<div class="ctx-item danger" onclick="deleteCard('${c.id}');hideCtx()">🗑 Löschen</div>`;
  menu.innerHTML=html;
  menu.style.display='block';
  let x=e.clientX,y=e.clientY;
  const mw=menu.offsetWidth||190;
  if(x+mw>window.innerWidth)x=window.innerWidth-mw-8;
  menu.style.left=x+'px';menu.style.top=y+'px';
}
function hideCtx(){
  document.getElementById('ctxMenu').style.display='none';
}
function moveCard(id,stageId){
  const c=contacts.find(x=>x.id===id);
  if(c){c.stage=stageId;save();renderCards();}
  hideCtx();
}

// ── SEARCH ──
function filterCards(){
  searchQ=document.getElementById('searchInput').value.trim();
  renderCards();
}

// ── EXPORT ──
function exportData(){
  const rows=[['Name','Unternehmen','Rolle','Stage','Notiz','Erstellt']];
  contacts.forEach(c=>{
    const st=STAGES.find(s=>s.id===c.stage);
    rows.push([c.name,c.company||'',c.role||'',st?st.label:c.stage,c.note||'',fmt(c.created)]);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download='roleiq-funnel-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ── CLOSE MODAL ON BG CLICK ──
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('click',e=>{if(!e.target.closest('.ctx-menu'))hideCtx()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideCtx()}});

buildBoard();
</script>
</body>
</html>
